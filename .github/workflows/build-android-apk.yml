name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Fix hardcoded Flutter SDK path in settings.gradle
        run: |
          export SDK_DIR="${FLUTTER_ROOT:-$(dirname "$(dirname "$(which flutter)")")}"
          echo "Using Flutter SDK at: $SDK_DIR"
          python3 -c '
          import os, re
          path = "android/settings.gradle"
          sdk = os.environ["SDK_DIR"]
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          content = re.sub(r"/[^\x27\"\s]+/flutter-sdk", sdk, content)
          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          '
          grep -n "flutter_tools/gradle" android/settings.gradle || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
