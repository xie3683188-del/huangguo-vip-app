name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Fix hardcoded Flutter SDK path in settings.gradle
        run: |
          export SDK_DIR="${FLUTTER_ROOT:-$(dirname "$(dirname "$(which flutter)")")}"
          echo "Using Flutter SDK at: $SDK_DIR"
          python3 -c '
          import os, re
          path = "android/settings.gradle"
          sdk = os.environ["SDK_DIR"]
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          content = re.sub(r"/[^\x27\"\s]+/flutter-sdk", sdk, content)
          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          '
          grep -n "flutter_tools/gradle" android/settings.gradle || true

      - name: Upgrade AGP & Gradle versions
        run: |
          python3 -c '
          import glob, re
          for p in glob.glob("android/**/*.gradle*", recursive=True):
              with open(p, "r", encoding="utf-8") as f:
                  s = f.read()
              s2 = re.sub(r"(com\.android\.application[\"'\''\s]+version\s+[\"'\''])8\.[0-4]\.[0-9]+", r"\g<1>8.6.0", s)
              s2 = re.sub(r"(com\.android\.library[\"'\''\s]+version\s+[\"'\''])8\.[0-4]\.[0-9]+", r"\g<1>8.6.0", s2)
              s2 = re.sub(r"(com\.android\.tools\.build:gradle:)8\.[0-4]\.[0-9]+", r"\g<1>8.6.0", s2)
              if s2 != s:
                  with open(p, "w", encoding="utf-8") as f:
                      f.write(s2)
          w = "android/gradle/wrapper/gradle-wrapper.properties"
          try:
              with open(w, "r", encoding="utf-8") as f:
                  ws = f.read()
              ws2 = re.sub(r"gradle-[0-9.]+\-(bin|all)\.zip", r"gradle-8.7-\1.zip", ws)
              with open(w, "w", encoding="utf-8") as f:
                  f.write(ws2)
          except FileNotFoundError:
              pass
          '

      - name: Install dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
