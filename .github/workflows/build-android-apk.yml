name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Fix hardcoded Flutter SDK path in settings.gradle
        run: |
          export SDK_DIR="${FLUTTER_ROOT:-$(dirname "$(dirname "$(which flutter)")")}"
          echo "Using Flutter SDK at: $SDK_DIR"
          python3 -c '
          import os, re
          path = "android/settings.gradle"
          sdk = os.environ["SDK_DIR"]
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          content = re.sub(r"/[^\x27\"\s]+/flutter-sdk", sdk, content)
          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          '
          grep -n "flutter_tools/gradle" android/settings.gradle || true

      - name: Upgrade AGP & Gradle versions
        run: |
          python3 -c '
          import glob, re
          for p in glob.glob("android/**/*.gradle*", recursive=True):
              with open(p, "r", encoding="utf-8") as f:
                  s = f.read()
              s2 = re.sub(r"(com\.android\.application[\"'\''\s]+version\s+[\"'\''])(8\.[0-9]+\.[0-9]+|9\.0\.[0-9]+)", r"\g<1>9.1.1", s)
              s2 = re.sub(r"(com\.android\.library[\"'\''\s]+version\s+[\"'\''])(8\.[0-9]+\.[0-9]+|9\.0\.[0-9]+)", r"\g<1>9.1.1", s2)
              s2 = re.sub(r"(com\.android\.tools\.build:gradle:)(8\.[0-9]+\.[0-9]+|9\.0\.[0-9]+)", r"\g<1>9.1.1", s2)
              if s2 != s:
                  with open(p, "w", encoding="utf-8") as f:
                      f.write(s2)
          w = "android/gradle/wrapper/gradle-wrapper.properties"
          try:
              with open(w, "r", encoding="utf-8") as f:
                  ws = f.read()
              ws2 = re.sub(r"gradle-[0-9.]+\-(bin|all)\.zip", r"gradle-9.3.1-\1.zip", ws)
              with open(w, "w", encoding="utf-8") as f:
                  f.write(ws2)
          except FileNotFoundError:
              pass
          '

      - name: Install dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: |
          flutter build apk --debug || echo "::warning::flutter build 返回非 0，继续收集产物"
          echo "=== Searching for generated APK files ==="
          find . -name "*.apk" -print
          echo "=== build output dirs ==="
          find build -maxdepth 4 -type d 2>/dev/null | head -40 || true
          if ! find . -name "*.apk" -print -quit | grep -q .; then
            echo "::error::构建结束后没有找到任何 .apk，请把本步骤完整日志发我"
            exit 1
          fi

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-files
          path: '**/*.apk'
          if-no-files-found: warn
